name: Delete published document

on:
  workflow_dispatch:
    inputs:
      site_path:
        description: Normalized published path, for example guides/reset-password
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: document-publishing
  cancel-in-progress: false

jobs:
  delete-and-deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[delete-published] ')
    runs-on: ubuntu-latest
    steps:
      - name: Authorize issue requester and read path
        if: github.event_name == 'issues'
        id: authorize
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          result-encoding: string
          script: |
            const prefix = '[delete-published] ';
            const title = context.payload.issue.title;
            let permission = 'none';
            try {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
              permission = response.data.permission;
            } catch (error) {
              core.info(`No collaborator permission found for ${context.actor}.`);
            }
            if (!['admin', 'maintain', 'write'].includes(permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'Deletion denied: repository write permission is required.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
              core.setFailed('Repository write permission is required.');
              return '';
            }
            return title.slice(prefix.length).trim();

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Delete published path
        env:
          SITE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.site_path || steps.authorize.outputs.result }}
        run: |
          python github_document_ops.py delete \
            --published-root mkdocs_preview/docs/published \
            --site-path "$SITE_PATH"

      - name: Run focused repository tests
        run: python -m unittest tests.test_github_document_ops tests.test_site_publish -v

      - name: Commit deletion
        env:
          SITE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.site_path || steps.authorize.outputs.result }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mkdocs_preview/docs/published
          if git diff --cached --quiet; then
            echo "No published document changes required a commit."
          else
            git commit -m "docs: delete ${SITE_PATH}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Close completed delete request
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Document deleted and GitHub Pages deployment completed.',
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
