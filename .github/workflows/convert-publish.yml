name: Convert and publish incoming documents

on:
  push:
    branches: [main]
    paths:
      - "incoming/**"
  workflow_dispatch:
    inputs:
      pdf_mode:
        description: PDF conversion mode
        required: true
        default: hybrid
        type: choice
        options:
          - hybrid
          - ocr
          - visual

permissions:
  contents: write

concurrency:
  group: document-publishing
  cancel-in-progress: false

jobs:
  convert-publish-deploy:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install OCR and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Convert and publish inbox
        env:
          PDF_MODE: ${{ inputs.pdf_mode || 'hybrid' }}
        run: |
          python github_document_ops.py process-incoming \
            --incoming-dir incoming \
            --published-root mkdocs_preview/docs/published \
            --diagnostics-dir artifacts/github-actions/current \
            --pdf-mode "$PDF_MODE"

      - name: Run focused repository tests
        run: python -m unittest tests.test_github_document_ops tests.test_site_publish -v

      - name: Commit published output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A incoming mkdocs_preview/docs/published
          if git diff --cached --quiet; then
            echo "No incoming documents required publication."
          else
            git commit -m "docs: publish incoming documents"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload conversion diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conversion-diagnostics-${{ github.run_id }}
          path: artifacts/github-actions/current
          if-no-files-found: error
