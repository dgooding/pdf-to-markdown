name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "incoming/**"
      - "mkdocs_preview/docs/published/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application modules
        run: python -m py_compile app.py convert_to_md.py github_document_ops.py

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Build documentation strictly
        run: python -m mkdocs build --strict -f mkdocs_preview/mkdocs.yml

      - name: Verify offline wheelhouse resolution
        run: python -m pip install --ignore-installed --no-index --find-links=wheelhouse -r requirements.txt --dry-run
