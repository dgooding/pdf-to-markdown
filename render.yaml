services:
  - type: web
    name: itsd-document-converter
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: "0.0.0.0"
      - key: DATA_ROOT
        value: /data/published-docs
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: STALE_JOB_SECONDS
        value: "3600"
      - key: PUBLISH_SECRET
        sync: false   # set this as a secret in the Render dashboard — never commit the value
    disk:
      name: published-docs
      mountPath: /data/published-docs
      sizeGB: 5
